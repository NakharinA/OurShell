# cargo-audit configuration. Every ignore needs a justification and a review date.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa, "Marvin" timing side channel). No fixed release exists.
    # OurShell only uses RSA client-side to generate keys and sign SSH user-auth
    # challenges on the user's own machine; it never performs RSA decryption and
    # exposes no remotely timeable RSA oracle. Ed25519 is the default key type.
    # Review again when `rsa` ships a constant-time fix (checked 2026-10-29).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 (crypto-bigint 0.5 timing variability). Pulled in only via
    # elliptic-curve 0.13 as a mandatory dependency of opaque-ke 4.0 (our OPAQUE suite
    # is ristretto255, computed by curve25519-dalek, so no secret P-curve math runs)
    # and via openidconnect's p256/p384 for verifying public ID-token signatures.
    # Upgrade when opaque-ke and openidconnect release on elliptic-curve >= 0.14
    # (checked 2026-10-29).
    "RUSTSEC-2026-0387",
]
