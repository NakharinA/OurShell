[package]
name = "ourshell"
description = "OurShell CLI and local agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ourshell-proto.workspace = true
anyhow.workspace = true
ourshell-core.workspace = true
interprocess = { version = "2.4.7", features = ["tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
rpassword = "7.5.4"
crossterm = { version = "0.29.0", features = ["event-stream"] }
base64 = "0.23.1"
chrono = "0.4.45"
uuid = { version = "1.26.1", features = ["v4"] }
regex = "1.13.1"
sha2 = "0.11.0"
futures = "0.3.34"
# `ourshell update` (crates/cli/src/update.rs). Same `rustls-tls` choice as
# ourshell-core's sync client (see crates/core/Cargo.toml) -- the `ring`
# crypto provider, never `aws-lc-sys`. `stream` lets the download be written
# to disk incrementally instead of buffered fully in memory.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
semver = "1"
# Archive formats the release workflow produces: .zip on Windows, .tar.gz elsewhere.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
self-replace = "1"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rand = "0.10"
russh = { version = "0.65.0", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
tokio = { workspace = true, features = ["full"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
