[package]
name = "ourshell"
description = "OurShell CLI and local agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ourshell-proto.workspace = true
anyhow.workspace = true
ourshell-core.workspace = true
interprocess = { version = "2.4.7", features = ["tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
rpassword = "7.5.4"
crossterm = { version = "0.29.0", features = ["event-stream"] }
base64 = "0.23.1"
chrono = "0.4.45"
uuid = { version = "1.26.1", features = ["v4"] }
regex = "1.13.1"
sha2 = "0.11.0"
futures = "0.3.34"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rand = "0.10"
russh = { version = "0.63.1", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0.1"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["full"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
