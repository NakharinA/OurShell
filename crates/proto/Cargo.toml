[package]
name = "ourshell-proto"
description = "OurShell shared wire types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["opaque"]
# OPAQUE (password-authenticated key exchange) cipher suite and client helpers.
# Off by default consumers can disable it to drop opaque-ke and its transitive deps.
opaque = ["dep:opaque-ke", "dep:argon2", "dep:sha2", "dep:rand"]

[dependencies]
base64 = "0.23.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# opaque feature only
opaque-ke = { version = "4.0.1", default-features = false, features = [
    "ristretto255",
    "argon2",
    "serde",
], optional = true }
argon2 = { version = "0.6", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.8", optional = true }
