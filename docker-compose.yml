# OurShell self-hosted sync server -- developer / build-from-source setup.
#
# Just want to run a server? Use the installer instead, which pulls the
# published image (ghcr.io/nakharina/ourshell-server) and sets everything up:
#
#   curl -fsSL https://github.com/NakharinA/OurShell/releases/latest/download/install-server.sh | sh
#
# This file builds the image from this checkout (or `docker compose pull`
# fetches the published one instead). See docs/self-hosting.md.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD (everything else optional)
#   docker compose up -d --build
#
# Then open http://localhost:8443/setup and enter the setup code from
# `docker compose logs server`. The wizard generates SERVER_MASTER_KEY and
# writes config.toml into the ourshell-data volume; anything set in .env
# below overrides the wizard's settings.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ourshell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ourshell}
    volumes:
      - ourshell-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ourshell} -d ${POSTGRES_DB:-ourshell}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/nakharina/ourshell-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ourshell:${POSTGRES_PASSWORD}@postgres:5432/ourshell}
      BIND_ADDR: 0.0.0.0:8443
      # Optional: the setup wizard generates one (stored in config.toml) when
      # this is empty. Set it (openssl rand -base64 32) for env-only deploys.
      SERVER_MASTER_KEY: ${SERVER_MASTER_KEY:-}
      OPAQUE_SERVER_SETUP: ${OPAQUE_SERVER_SETUP:-}
      SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-true}
      INVITE_ONLY: ${INVITE_ONLY:-false}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-10}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ourshell-data:/data
    ports:
      - "${OURSHELL_PORT:-8443}:8443"

volumes:
  ourshell-postgres-data:
  ourshell-data:
