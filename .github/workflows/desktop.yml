name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - ".github/workflows/desktop.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      # Tauri 2's runtime deps on Linux (webkit2gtk, appindicator, rsvg, ...).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm ci
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm run test

      # The agent binary (`ourshell agent`) is built by the root workspace and
      # copied in as the Tauri sidecar; see apps/desktop/README.md.
      - name: Build the ourshell CLI/agent binary
        working-directory: .
        run: cargo build --release -p ourshell

      - name: Copy sidecar binary
        run: node scripts/copy-sidecar.mjs --release

      # tauri-build checks that the sidecar exists, so this must run after the copy.
      - name: cargo clippy (src-tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the desktop app bundle
        run: npx tauri build --bundles ${{ runner.os == 'Linux' && 'deb,appimage' || runner.os == 'macOS' && 'dmg' || 'nsis,msi' }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ourshell-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
