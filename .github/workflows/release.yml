name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-13, target: x86_64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ourshell -p ourshell-mcp
      - name: Package
        shell: bash
        run: |
          name=ourshell-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/ourshell${{ matrix.ext }} "dist/$name/"
          cp target/${{ matrix.target }}/release/ourshell-mcp${{ matrix.ext }} "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - name: Checksums
        shell: bash
        run: cd dist && (sha256sum ourshell-* 2>/dev/null || shasum -a 256 ourshell-*) | grep -v '/$' > SHA256SUMS-${{ matrix.target }}.txt || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
