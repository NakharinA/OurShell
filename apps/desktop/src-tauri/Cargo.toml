[workspace]
resolver = "2"
members = ["."]

[package]
name = "ourshell-desktop"
description = "OurShell desktop app (Tauri 2 shell over the local agent)"
version = "0.7.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NakharinA/OurShell"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ourshell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ourshell-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ourshell-proto = { path = "../../../crates/proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "process"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
interprocess = { version = "2", features = ["tokio"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
# Fallback update check for builds without the `updater` feature (see
# commands::check_latest_release): queries the GitHub API for the latest
# release from Rust rather than the webview, so the CSP's connect-src never
# needs to allow api.github.com. `rustls-tls` (not `default-tls`) so it uses
# the pure-Rust `ring` provider, same choice as ourshell-core's sync client.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
semver = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[features]
# Enabled by the release workflow together with tauri.updater.conf.json.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

# Keep debug builds small (see the workspace Cargo.toml).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
