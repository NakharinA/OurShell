[workspace]
resolver = "2"
members = ["crates/core", "crates/proto", "crates/cli", "crates/mcp", "server"]
exclude = ["apps/desktop/src-tauri", "fuzz"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NakharinA/OurShell"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
ourshell-core = { path = "crates/core" }
ourshell-proto = { path = "crates/proto" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keep debug builds small: full debug info only for our own crates, none for
# dependencies (they made up most of a ~45 GB target/ directory).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
