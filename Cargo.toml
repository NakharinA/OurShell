[workspace]
resolver = "2"
members = ["crates/core", "crates/proto", "crates/cli", "crates/mcp", "server"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/NakharinA/OurShell"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
ourshell-core = { path = "crates/core" }
ourshell-proto = { path = "crates/proto" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
